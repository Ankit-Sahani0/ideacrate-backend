spring.application.name=ideacrate-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/ideacrate_db
spring.profiles.active=local

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration - MUST be set via environment variables in production
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}